name: "TS43 bundle proof"
permissions: {}
on:
  push:
    branches:
      - keeltrace/2994-ts43-bundle-proof-ci
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: 1
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Focused TS43 unit tests
        run: ./gradlew :play-services-constellation-core:testDebugUnitTest --tests 'org.microg.gms.constellation.core.verification.ts43.*'
      - name: Constellation lint
        run: ./gradlew :play-services-constellation-core:lintDebug
      - name: Constellation assemble
        run: ./gradlew :play-services-constellation-core:assembleDebug
